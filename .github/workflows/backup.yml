name: Supabase backup

on:
  workflow_call:
    inputs:
      backup-prefix: {required: true, type: string}
      age-recipient: {required: true, type: string}
      r2-endpoint: {required: true, type: string}
      r2-bucket: {required: true, type: string}
      max-age-hours: {required: false, default: 36, type: number}
      postgres-client-version: {required: false, default: '17', type: string}
      package-version: {required: false, default: '1', type: string}
    secrets:
      database-url: {required: true}
      r2-access-key-id: {required: true}
      r2-secret-access-key: {required: true}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client and age
        env:
          PG_MAJOR: ${{ inputs.postgres-client-version }}
        run: |
          set -euo pipefail
          key=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o "$key" https://www.postgresql.org/media/keys/ACCC4CF8.asc
          repo="deb [signed-by=$key] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main"
          echo "$repo" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes "postgresql-client-$PG_MAJOR" age
          echo "/usr/lib/postgresql/$PG_MAJOR/bin" >> "$GITHUB_PATH"
      - name: Verify PostgreSQL client tools agree
        run: |
          set -euo pipefail
          command -v pg_dump pg_restore
          pg_dump --version
          pg_restore --version
      - name: Create encrypted backup
        env:
          SOURCE_DATABASE_URL: ${{ secrets.database-url }}
          BACKUP_AGE_RECIPIENT: ${{ inputs.age-recipient }}
          R2_ACCESS_KEY_ID: ${{ secrets.r2-access-key-id }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.r2-secret-access-key }}
          R2_ENDPOINT: ${{ inputs.r2-endpoint }}
          R2_BUCKET: ${{ inputs.r2-bucket }}
          BACKUP_PREFIX: ${{ inputs.backup-prefix }}
        run: npx @pixpilot/supabase-backup@${{ inputs.package-version }} backup
      - name: Verify backup health
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.r2-access-key-id }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.r2-secret-access-key }}
          R2_ENDPOINT: ${{ inputs.r2-endpoint }}
          R2_BUCKET: ${{ inputs.r2-bucket }}
          BACKUP_PREFIX: ${{ inputs.backup-prefix }}
        run: npx @pixpilot/supabase-backup@${{ inputs.package-version }} status --max-age-hours ${{ inputs.max-age-hours }}
