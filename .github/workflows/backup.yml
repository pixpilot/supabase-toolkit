name: Supabase backup

on:
  workflow_call:
    inputs:
      backup-prefix: {required: true, type: string}
      age-recipient: {required: true, type: string}
      r2-endpoint: {required: true, type: string}
      r2-bucket: {required: true, type: string}
      max-age-hours: {required: false, default: 36, type: number}
      postgres-client-version: {required: false, default: '17', type: string}
      package-version: {required: false, default: latest, type: string}
    secrets:
      database-url: {required: true}
      r2-access-key-id: {required: true}
      r2-secret-access-key: {required: true}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client and age
        env:
          PG_MAJOR: ${{ inputs.postgres-client-version }}
        run: |
          set -euo pipefail
          key=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o "$key" https://www.postgresql.org/media/keys/ACCC4CF8.asc
          repo="deb [signed-by=$key] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main"
          echo "$repo" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes "postgresql-client-$PG_MAJOR" age
          echo "/usr/lib/postgresql/$PG_MAJOR/bin" >> "$GITHUB_PATH"
      - name: Verify PostgreSQL client tools agree
        run: |
          set -euo pipefail
          command -v pg_dump pg_restore
          pg_dump --version
          pg_restore --version
      # The CLI reads no environment configuration; every value is a flag. The
      # step environment only carries the values into the command, because
      # interpolating a secret straight into the shell would break on a quote or
      # a backtick, and "$VAR" cannot.
      - name: Create encrypted backup
        env:
          SB_DATABASE_URL: ${{ secrets.database-url }}
          SB_AGE_RECIPIENT: ${{ inputs.age-recipient }}
          SB_R2_ACCESS_KEY_ID: ${{ secrets.r2-access-key-id }}
          SB_R2_SECRET_ACCESS_KEY: ${{ secrets.r2-secret-access-key }}
          SB_R2_ENDPOINT: ${{ inputs.r2-endpoint }}
          SB_R2_BUCKET: ${{ inputs.r2-bucket }}
          SB_BACKUP_PREFIX: ${{ inputs.backup-prefix }}
        run: |
          set -euo pipefail
          npx @pixpilot/supabase-backup@${{ inputs.package-version }} backup \
            --source-database-url "$SB_DATABASE_URL" \
            --age-recipient "$SB_AGE_RECIPIENT" \
            --r2-access-key-id "$SB_R2_ACCESS_KEY_ID" \
            --r2-secret-access-key "$SB_R2_SECRET_ACCESS_KEY" \
            --r2-endpoint "$SB_R2_ENDPOINT" \
            --r2-bucket "$SB_R2_BUCKET" \
            --prefix "$SB_BACKUP_PREFIX" \
            --no-input
      - name: Verify backup health
        env:
          SB_R2_ACCESS_KEY_ID: ${{ secrets.r2-access-key-id }}
          SB_R2_SECRET_ACCESS_KEY: ${{ secrets.r2-secret-access-key }}
          SB_R2_ENDPOINT: ${{ inputs.r2-endpoint }}
          SB_R2_BUCKET: ${{ inputs.r2-bucket }}
          SB_BACKUP_PREFIX: ${{ inputs.backup-prefix }}
          SB_MAX_AGE_HOURS: ${{ inputs.max-age-hours }}
        run: |
          set -euo pipefail
          npx @pixpilot/supabase-backup@${{ inputs.package-version }} status \
            --r2-access-key-id "$SB_R2_ACCESS_KEY_ID" \
            --r2-secret-access-key "$SB_R2_SECRET_ACCESS_KEY" \
            --r2-endpoint "$SB_R2_ENDPOINT" \
            --r2-bucket "$SB_R2_BUCKET" \
            --prefix "$SB_BACKUP_PREFIX" \
            --max-age-hours "$SB_MAX_AGE_HOURS" \
            --no-input
